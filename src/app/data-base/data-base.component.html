<div class="root grid-col-1fr-1fr">
    <!-- Nom du calendrier : <input [(ngModel)]="name">

    <div>
        Liste des fichiers disponibles :
    </div> -->

    <div>
        @for( year of years(); track year){
        <div class="margin-top-10">
            <a matFab extended [download]="getFileName(year)" [href]="convertToFile(year)">
                <i class="fas fa-download" title="Télécharger le fichier"></i> {{year}}
            </a>
        </div>
        }

    </div>

    <div>
        <div>
            @for( year of years(); track year){
            <button (click)="import(year)" matButton="filled" color="primary">
                {{year}}
            </button>
            }
        </div>

        <div class="margin-top-10">
            <textarea class="textarea" [value]="dataToImport()" (input)="onTextareaInput($event)"></textarea>
        </div>
        <div> <button (click)="massUploadAsync()" matButton="filled" color="primary">Importer</button> </div>
        {{message()}}
    </div>
    <!-- <div>
        Importer un fichier : <input type="file" accept="application/json" (change)="onFileSelected($event)" />
    </div> -->

</div>
