<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    @media only screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
        padding: 24px 16px !important;
      }

      .email-title {
        font-size: 22px !important;
      }

      .email-subtitle {
        font-size: 14px !important;
      }

      .email-button {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
        padding: 14px 0 !important;
      }
    }
  </style>
</head>

<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
    style="background-color:#f4f4f4; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0"
          style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; padding:40px; text-align:center;">
          <tr>
            <td align="center">
              <h1 class="email-title" style="color:#222222; font-size:26px; margin:0 0 16px 0;">
                Connectez-vous à Calendrier
              </h1>
              <h2 class="email-subtitle" style="color:#555555; font-weight:normal; font-size:16px; margin:0 0 30px 0;">
                Cliquez sur le bouton ci-dessous pour terminer la connexion. Ce lien expire dans 10 minutes.
              </h2>
              <a href="[url]" class="email-button"
                style="background-color:#4A90E2; color:#ffffff; text-decoration:none; padding:14px 32px; border-radius:6px; font-size:16px; font-weight:bold; display:inline-block;">
                Se connecter
              </a>
              <p style="color:#888888; font-size:13px; margin:30px 0 0 0;">
                Si vous n’avez pas demandé cet e-mail, vous pouvez l’ignorer en toute sécurité.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
